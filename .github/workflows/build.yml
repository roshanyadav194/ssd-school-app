name: Build Flutter APK & AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Files & App Logo
        run: |
          mkdir -p lib
          [ -f main.dart ] && mv main.dart lib/main.dart || true
          [ -f assets/icon/app_logo.png ] && cp assets/icon/app_logo.png ./app_logo.png || true

      - name: Create Base Flutter Project
        run: |
          flutter create --org com.ssdconvent --project-name ssd_school_app temp_app
          cp -rn temp_app/android ./ 2>/dev/null || true
          cp -rn temp_app/web ./ 2>/dev/null || true
          rm -rf temp_app

      - name: Install Dependencies & Generate Launcher Icon
        run: |
          flutter pub get
          if [ -f "app_logo.png" ]; then
            dart run flutter_launcher_icons || true
          fi

      - name: Patch AndroidManifest & Force SDK 36 on App + All Plugins (file_picker)
        run: |
          python3 - << 'EOF'
          import os, re, glob

          # 1. Patch AndroidManifest.xml (App Name + Permissions)
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r") as f:
                  c = f.read()
              c = c.replace('android:label="ssd_school_app"', 'android:label="S.S.D. Convent School"')
              perms = """    <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <queries>
                  <intent><action android:name="android.intent.action.VIEW" /><data android:scheme="https" /></intent>
                  <intent><action android:name="android.intent.action.DIAL" /><data android:scheme="tel" /></intent>
                  <intent><action android:name="android.intent.action.VIEW" /><data android:scheme="geo" /></intent>
              </queries>
          </manifest>"""
              if "android.permission.INTERNET" not in c:
                  c = c.replace("</manifest>", perms)
              with open(manifest_path, "w") as f:
                  f.write(c)

          # 2. Patch ALL build.gradle and build.gradle.kts in android/ AND pub-cache plugins (fixes :file_picker)
          search_roots = ["android"]
          pub_cache = os.path.expanduser("~/.pub-cache")
          if os.path.exists(pub_cache):
              search_roots.append(pub_cache)

          for root_dir in search_roots:
              for dirpath, _, filenames in os.walk(root_dir):
                  for fn in filenames:
                      if fn in ("build.gradle", "build.gradle.kts"):
                          fp = os.path.join(dirpath, fn)
                          try:
                              with open(fp, "r") as f:
                                  txt = f.read()
                              orig = txt
                              # Replace Groovy & Kotlin DSL compileSdk / targetSdk definitions
                              txt = re.sub(r'compileSdkVersion\s+.*', 'compileSdkVersion 36', txt)
                              txt = re.sub(r'compileSdk\s*=\s*.*', 'compileSdk = 36', txt)
                              txt = re.sub(r'compileSdk\s+\d+', 'compileSdk 36', txt)
                              txt = re.sub(r'compileSdk\s+flutter\.compileSdkVersion', 'compileSdk 36', txt)
                              txt = re.sub(r'targetSdkVersion\s+.*', 'targetSdkVersion 36', txt)
                              txt = re.sub(r'targetSdk\s*=\s*.*', 'targetSdk = 36', txt)
                              txt = re.sub(r'targetSdk\s+\d+', 'targetSdk 36', txt)
                              if txt != orig:
                                  with open(fp, "w") as f:
                                      f.write(txt)
                                  print(f"Patched SDK 36 in: {fp}")
                          except Exception as e:
                              pass
          EOF

      - name: Build Android App Bundle (.aab for Play Store)
        run: |
          flutter build appbundle --release

      - name: Build Android APK (for direct install)
        run: |
          flutter build apk --release

      - name: Upload Play Store AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: ssd-convent-playstore-aab
          path: build/app/outputs/bundle/release/*.aab

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ssd-convent-direct-apk
          path: build/app/outputs/flutter-apk/*.apk
