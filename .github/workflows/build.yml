name: Build Flutter APK & AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Files & App Logo
        run: |
          mkdir -p lib
          [ -f main.dart ] && mv main.dart lib/main.dart || true
          [ -f assets/icon/app_logo.png ] && cp assets/icon/app_logo.png ./app_logo.png || true

      - name: Create Base Flutter Project
        run: |
          flutter create --org com.ssdconvent --project-name ssd_school_app temp_app
          cp -rn temp_app/android ./ 2>/dev/null || true
          cp -rn temp_app/web ./ 2>/dev/null || true
          rm -rf temp_app

      - name: Configure Android Permissions & App Name
        run: |
          python3 - << 'EOF'
          import os
          p = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(p):
              with open(p, "r") as f:
                  c = f.read()
              c = c.replace('android:label="ssd_school_app"', 'android:label="S.S.D. Convent School"')
              perms = """    <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <queries>
                  <intent><action android:name="android.intent.action.VIEW" /><data android:scheme="https" /></intent>
                  <intent><action android:name="android.intent.action.DIAL" /><data android:scheme="tel" /></intent>
                  <intent><action android:name="android.intent.action.VIEW" /><data android:scheme="geo" /></intent>
              </queries>
          </manifest>"""
              if "android.permission.INTERNET" not in c:
                  c = c.replace("</manifest>", perms)
              with open(p, "w") as f:
                  f.write(c)
          EOF

      - name: Configure Unified SDK 36 Across All Plugins
        run: |
          # 1. Ensure local.properties targets SDK 36
          echo "flutter.compileSdkVersion=36" >> android/local.properties
          echo "flutter.targetSdkVersion=36" >> android/local.properties
          echo "flutter.minSdkVersion=21" >> android/local.properties

          # 2. Append subprojects rule directly into android/build.gradle
          # This forces :file_picker, :app_links, and all plugins to compile with SDK 36
          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      android {
                          compileSdkVersion 36
                          buildToolsVersion "36.0.0"
                          defaultConfig {
                              targetSdkVersion 36
                          }
                      }
                  }
              }
          }
          EOF

      - name: Install Dependencies & Generate Launcher Icon
        run: |
          flutter pub get
          if [ -f "app_logo.png" ]; then
            dart run flutter_launcher_icons || true
          fi

      - name: Build Android App Bundle (.aab for Play Store)
        run: |
          flutter build appbundle --release

      - name: Build Android APK (for direct install)
        run: |
          flutter build apk --release

      - name: Upload Play Store AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: ssd-convent-playstore-aab
          path: build/app/outputs/bundle/release/*.aab

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ssd-convent-direct-apk
          path: build/app/outputs/flutter-apk/*.apk
