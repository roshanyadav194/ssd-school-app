name: Build Flutter APK & AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Files & App Logo
        run: |
          mkdir -p lib
          [ -f main.dart ] && mv main.dart lib/main.dart || true
          [ -f assets/icon/app_logo.png ] && cp assets/icon/app_logo.png ./app_logo.png || true

      - name: Create Base Flutter Project
        run: |
          flutter create --org com.ssdconvent --project-name ssd_school_app temp_app
          cp -rn temp_app/android ./ 2>/dev/null || true
          cp -rn temp_app/web ./ 2>/dev/null || true
          rm -rf temp_app

      - name: Configure Android Permissions & App Name
        run: |
          sed -i 's/android:label="ssd_school_app"/android:label="S.S.D. Convent School"/g' android/app/src/main/AndroidManifest.xml || true
          
          # Safely inject internet permission before </manifest>
          if ! grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml; then
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <queries>\n        <intent><action android:name="android.intent.action.VIEW" /><data android:scheme="https" /></intent>\n        <intent><action android:name="android.intent.action.DIAL" /><data android:scheme="tel" /></intent>\n        <intent><action android:name="android.intent.action.VIEW" /><data android:scheme="geo" /></intent>\n    </queries>' android/app/src/main/AndroidManifest.xml
          fi

      - name: Set CompileSdk to 34 for File Picker
        run: |
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/compileSdk.*/compileSdk 34/g' android/app/build.gradle || true
            sed -i 's/targetSdkVersion.*/targetSdkVersion 34/g' android/app/build.gradle || true
            sed -i 's/minSdkVersion.*/minSdkVersion 21/g' android/app/build.gradle || true
          fi

      - name: Install Dependencies & Generate Launcher Icon
        run: |
          flutter pub get
          if [ -f "app_logo.png" ]; then
            dart run flutter_launcher_icons
          fi

      - name: Build Android App Bundle (.aab for Play Store)
        run: |
          flutter build appbundle --release

      - name: Build Android APK (for direct install)
        run: |
          flutter build apk --release

      - name: Upload Play Store AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: ssd-convent-playstore-aab
          path: build/app/outputs/bundle/release/*.aab

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ssd-convent-direct-apk
          path: build/app/outputs/flutter-apk/*.apk
